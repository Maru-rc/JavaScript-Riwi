<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="bg-white shadow-sm py-5 px-8">
    <h1 class="text-2xl font-bold text-gray-800">Mi Tienda</h1>
  </header>

  <main class="max-w-6xl mx-auto px-8 py-10">
    <h2 class="text-xl font-semibold text-gray-700 mb-6">Productos destacados</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"  id="productos">

    </div>
  </main>

<div class="flex justify-center py-8">
  <div class="inline-flex items-center">
    <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-l" id="boton-atras">
      Prev
    </button>
    <span class="bg-white text-gray-800 font-semibold py-2 px-4 border-l border-r border-gray-400" id="pagina-actual">1</span>
    <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-r border-l border-gray-400" id="boton-adelante">
      Next
    </button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
